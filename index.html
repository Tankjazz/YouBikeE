<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#111">
<title>電輔車在哪</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root{--green:#1db954;--gray:#8a8f98;--red:#e5484d;--blue:#3b82f6;--bg:#111;--fg:#fff}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif;background:var(--bg);color:var(--fg)}
  #map{position:fixed !important;inset:0;width:100vw;height:100vh;height:100dvh}
  /* 頂端模式切換 */
  #top{position:fixed;top:calc(env(safe-area-inset-top) + 10px);left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;z-index:7}
  #top>*{pointer-events:auto}
  #topRow{display:flex;justify-content:center;gap:8px}
  /* 搜尋列＋下拉結果 */
  #searchWrap{position:relative;width:calc(100% - 24px);max-width:520px}
  #search{display:flex;align-items:center;gap:8px;height:46px;padding:0 8px 0 14px;background:rgba(17,17,17,.92);border-radius:999px;box-shadow:0 2px 10px rgba(0,0,0,.35)}
  #search .ico{font-size:16px;flex:none}
  #q{flex:1;min-width:0;border:0;outline:0;background:transparent;color:#fff;font-size:17px;font-family:inherit;-webkit-appearance:none}
  #q::placeholder{color:#888}
  #qClear{flex:none;width:32px;height:32px;border:0;border-radius:50%;background:#3a3a3c;color:#ddd;font-size:18px;line-height:1;display:none}
  #sugg{position:absolute;left:0;right:0;top:calc(100% + 6px);background:#1c1c1e;border-radius:16px;box-shadow:0 6px 24px rgba(0,0,0,.5);max-height:55vh;overflow-y:auto;display:none}
  #sugg.show{display:block}
  .sg{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border:0;border-bottom:1px solid #2c2c2e;background:transparent;color:#fff;text-align:left;font-family:inherit}
  .sg:last-child{border-bottom:0}
  .sg .ic{flex:none;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;background:#3a3a3c}
  .sg.fav .ic{background:#ff2d55}
  .sg .tx{flex:1;min-width:0}
  .sg .tx b,.sg .tx span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sg .tx b{font-size:16px}
  .sg .tx span{font-size:13px;color:#aaa}
  .sg small{flex:none;color:#aaa;font-size:13px}
  .sgMsg{padding:12px 14px;color:#aaa;font-size:14px}
  .srch{width:30px;height:30px;border-radius:50%;background:#ff9f0a;border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-size:15px;box-shadow:0 0 0 5px rgba(255,159,10,.3)}
  .seg{display:flex;background:rgba(17,17,17,.92);border-radius:999px;padding:4px;box-shadow:0 2px 10px rgba(0,0,0,.35)}
  .seg button{border:0;background:transparent;color:#bbb;font-size:16px;font-weight:700;padding:8px 16px;border-radius:999px}
  .seg button.on{background:#fff;color:#111}
  #status{position:fixed;top:calc(env(safe-area-inset-top) + 116px);left:0;right:0;text-align:center;font-size:13px;color:#ddd;text-shadow:0 1px 3px #000;pointer-events:none;z-index:5}
  /* 右下按鈕 */
  #fabs{position:fixed;right:12px;bottom:calc(env(safe-area-inset-bottom) + 24px);display:flex;flex-direction:column;gap:10px;z-index:5}
  .fab{width:52px;height:52px;border-radius:50%;border:0;background:#fff;color:#111;font-size:22px;box-shadow:0 2px 10px rgba(0,0,0,.35)}
  .fab.dest{background:var(--blue);color:#fff}
  #btnLoc.on{color:var(--blue)}   /* 藍色＝地圖正在跟著你跑 */
  /* 站點圓點 */
  .pin{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:#fff;border:2px solid #fff;font-family:"Helvetica Neue",Arial,sans-serif;contain:layout paint;transform:translateZ(0)}
  .pin.g{background:var(--green)}.pin.y{background:var(--gray)}.pin.r{background:var(--red)}
  .pin.sel{outline:3px solid #ffd60a}
  .dpin{width:18px;height:18px;border-radius:50%;background:var(--blue);border:3px solid #fff;box-shadow:0 0 0 4px rgba(59,130,246,.35)}
  /* 底部卡片 */
  #card{position:fixed;left:0;right:0;bottom:0;background:#1c1c1e;color:#fff;border-radius:18px 18px 0 0;padding:14px 16px calc(env(safe-area-inset-bottom) + 14px);transform:translateY(110%);transition:transform .2s;z-index:6;box-shadow:0 -4px 20px rgba(0,0,0,.4)}
  #card.show{transform:none}
  #card h2{margin:0 0 2px;font-size:20px}
  #card .addr{color:#aaa;font-size:13px;margin-bottom:12px}
  .nums{display:flex;gap:8px;margin-bottom:12px}
  .num{flex:1;border-radius:12px;padding:10px 6px;text-align:center;background:#2c2c2e}
  .num b{display:block;font-size:30px;line-height:1.1}
  .num span{font-size:12px;color:#bbb}
  .num.e{background:#153f27}.num.e b{color:#4ade80}
  .btns{display:flex;gap:8px}
  .btns a,.btns button{flex:1;text-align:center;text-decoration:none;border:0;border-radius:12px;padding:12px 6px;font-size:16px;font-weight:700;background:#fff;color:#111}
  .btns .sec{background:#3a3a3c;color:#fff}
  #close{position:absolute;right:10px;top:8px;background:transparent;border:0;color:#aaa;font-size:24px}
  /* 路線面板 */
  #plan{display:none}
  #plan.show{display:block}
  #plan .row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #333;font-size:15px}
  #plan .row:last-of-type{border:0}
  #plan .dot{width:12px;height:12px;border-radius:50%;flex:none}
  #plan .row small{color:#aaa;margin-left:auto;white-space:nowrap}
  #hint{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 90px);background:rgba(59,130,246,.95);color:#fff;padding:12px 14px;border-radius:12px;font-size:15px;text-align:center;display:none;z-index:5}
  #hint.show{display:block}
  /* 我的地點 */
  .pl{width:24px;height:24px;border-radius:50%;background:#ff2d55;border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;contain:layout paint;transform:translateZ(0)}
  .pl.sel{outline:3px solid #ffd60a}
  .tag{display:inline-block;background:#ff2d55;color:#fff;font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px;margin-bottom:6px}
  #segPlaces button.on{background:#ff2d55;color:#fff}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:flex;align-items:center;justify-content:center;padding:20px}
  .modal .box{background:#1c1c1e;border-radius:16px;padding:20px;width:100%;max-width:360px}
  .modal h2{margin:0 0 6px;font-size:20px}
  .modal p{color:#bbb;font-size:14px;margin:0 0 12px}
  .modal input{width:100%;font-size:18px;padding:12px;border-radius:10px;border:1px solid #444;background:#111;color:#fff}
  #keywarn{position:fixed;inset:0;background:#111;color:#fff;padding:24px;z-index:9;display:none;font-size:16px;line-height:1.6}
  #keywarn code{background:#333;padding:2px 6px;border-radius:6px}
</style>
</head>
<body>
<div id="map"></div>

<div id="top">
  <div id="searchWrap">
    <div id="search">
      <span class="ico">🔍</span>
      <input id="q" type="text" inputmode="search" enterkeyhint="search" placeholder="搜尋要去的地方" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
      <button id="qClear" aria-label="清除搜尋">×</button>
    </div>
    <div id="sugg"></div>
  </div>
  <div id="topRow">
    <div class="seg">
      <button id="modeRent" class="on">借車</button>
      <button id="modeReturn">還車</button>
    </div>
    <div class="seg">
      <button id="filterE" class="on" title="只看有電輔車">⚡ 只看電輔</button>
    </div>
    <div class="seg" id="segPlaces" style="display:none">
      <button id="togglePlaces" title="我的 Google 地圖收藏">❤</button>
    </div>
  </div>
</div>
<div id="status">載入中…</div>

<div id="fabs">
  <button class="fab dest" id="btnDest" title="規劃路線">🧭</button>
  <button class="fab" id="btnLoc" title="回到我的位置">◎</button>
</div>
<div id="hint">在地圖上<b>長按</b>你要去的地方 → 我幫你挑最近的借車站、還車站</div>

<div id="card">
  <button id="close">×</button>
  <div id="stationView">
    <h2 id="cName">—</h2>
    <div class="addr" id="cAddr">—</div>
    <div class="nums">
      <div class="num e"><b id="cE">0</b><span>⚡ 電輔車</span></div>
      <div class="num"><b id="cY">0</b><span>一般車</span></div>
      <div class="num"><b id="cEmpty">0</b><span>空位可還</span></div>
    </div>
    <div class="btns">
      <a id="cNav" target="_blank" rel="noopener">🚶 Google 導航到這站</a>
      <button class="sec" id="cSetStart">設為借車站</button>
    </div>
  </div>
  <div id="placeView" style="display:none">
    <div class="tag" id="plList">清單</div>
    <h2 id="plName">—</h2>
    <div class="addr" id="plAddr">—</div>
    <div class="addr" id="plNote" style="color:#ffd60a"></div>
    <div class="btns">
      <button id="plGo">🚲 騎 YouBike 去這裡</button>
      <a id="plOpen" class="sec" target="_blank" rel="noopener">開 Google Maps</a>
    </div>
  </div>
  <div id="plan">
    <h2>騎乘路線</h2>
    <div class="row"><span class="dot" style="background:#fff"></span><span>我的位置</span><small>起點</small></div>
    <div class="row"><span class="dot" style="background:var(--green)"></span><span id="pA">—</span><small id="pAd">—</small></div>
    <div class="row"><span class="dot" style="background:var(--red)"></span><span id="pB">—</span><small id="pBd">—</small></div>
    <div class="row"><span class="dot" style="background:var(--blue)"></span><span>目的地</span><small id="pDest">—</small></div>
    <div class="btns" style="margin-top:12px">
      <a id="pNav" target="_blank" rel="noopener">🚲 開 Google Maps 導航</a>
      <button class="sec" id="pClear">清除</button>
    </div>
    <div style="color:#888;font-size:12px;margin-top:8px">借車站＝離你最近、有⚡電輔車的站；還車站＝離目的地最近、有空位的站。</div>
  </div>
</div>

<div id="pwd" class="modal" style="display:none">
  <div class="box">
    <h2>解鎖我的地點</h2>
    <p>輸入密碼，顯示你 Google 地圖收藏的地點。密碼只存在這支手機。</p>
    <input id="pwdIn" type="password" inputmode="text" autocomplete="off" placeholder="密碼">
    <div class="btns" style="margin-top:12px">
      <button id="pwdOk">解鎖</button>
      <button class="sec" id="pwdSkip">先不要</button>
    </div>
    <div id="pwdErr" style="color:#ff6b6b;font-size:14px;margin-top:8px"></div>
  </div>
</div>

<div id="keywarn">
  <h2>還沒填 Google Maps 金鑰</h2>
  <p>打開 <code>index.html</code>，把 <code>YOUR_KEY_HERE</code> 換成你的 API 金鑰。</p>
</div>

<script>
/* ========= 設定 ========= */
const API_KEY = 'AIzaSyAZ50vOYorG1FcmmH0Vo4BBNbCgz0aEm5A';                                  // ← 換成你的 Google Maps 金鑰
const DATA_URL = 'https://apis.youbike.com.tw/json/station-yb2.json'; // YouBike 官方全台站點 JSON（含 eyb 電輔車數）
const REFRESH_MS = 60_000;      // 幾秒抓一次
const LOCATE_MS = 30_000;       // 幾秒強制重抓一次定位（平常走動時藍點本來就會即時更新）
const MIN_ZOOM_FOR_PINS = 14;   // 縮太遠不畫點（省效能）
const MAX_PINS = 120;           // 一次最多畫幾個點（離畫面中心最近的優先；太多會卡）
const DEFAULT_CENTER = { lat: 25.0418, lng: 121.5436 };  // 台北車站附近

/* ========= 狀態 ========= */
let map, me = null, meMarker = null, stations = [], markers = new Map(), selected = null;
let mode = 'rent';        // rent | return
let onlyE = true;         // 只看有電輔車
let dest = null, destMarker = null, planning = false, startStation = null;
let watchId = null, following = true, planWaiting = false;   // following＝地圖跟著藍點跑（按 ◎ 開、手拖地圖關）
let statusBase = '載入中…';

/* ========= 工具 ========= */
const $ = id => document.getElementById(id);
const dist = (a, b) => {   // 兩點距離（公尺）
  const R = 6371000, toR = x => x * Math.PI / 180;
  const dLat = toR(b.lat - a.lat), dLng = toR(b.lng - a.lng);
  const s = Math.sin(dLat / 2) ** 2 + Math.cos(toR(a.lat)) * Math.cos(toR(b.lat)) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(s));
};
const fmtD = m => m < 1000 ? `${Math.round(m)} m` : `${(m / 1000).toFixed(1)} km`;
const eOf = s => s.available_spaces_detail?.eyb ?? 0;
const yOf = s => (s.available_spaces_detail?.yb2 ?? 0) + (s.available_spaces_detail?.yb1 ?? 0);
const setStatus = t => $('status').textContent = t;

/* ========= 資料 ========= */
async function loadData() {
  try {
    const r = await fetch(DATA_URL, { cache: 'no-store' });
    const raw = await r.json();
    stations = raw.filter(s => s.status === 1 && s.lat && s.lng)
      .map(s => ({ ...s, lat: +s.lat, lng: +s.lng }));
    const t = raw[0]?.updated_at?.slice(11, 16) || '';
    statusBase = `全台 ${stations.length} 站｜資料時間 ${t}`;
    setStatus(statusBase);
    render();
    if (selected) showStation(stations.find(s => s.station_no === selected.station_no) || selected);
  } catch (e) {
    setStatus('資料抓不到，稍後再試');
    console.error(e);
  }
}

/* ========= 地圖 ========= */
function initMap() {
  map = new google.maps.Map($('map'), {
    center: DEFAULT_CENTER, zoom: 15, mapId: 'DEMO_MAP_ID',
    disableDefaultUI: true, gestureHandling: 'greedy', clickableIcons: false,
  });
  // 縮放/拖曳結束後才重畫，且稍微延遲，避免連續手勢時重複重畫
  let renderTimer = null;
  map.addListener('idle', () => { clearTimeout(renderTimer); renderTimer = setTimeout(render, 80); });
  map.addListener('click', () => { hideSugg(); $('q').blur(); if (!planning) hideCard(); });
  map.addListener('dragstart', () => setFollow(false));   // 手一拖地圖就不再自動拉回
  // 長按 = 設目的地（手指一動、地圖一縮放就取消，避免誤觸）
  let pressTimer = null;
  map.addListener('mousedown', ev => { clearTimeout(pressTimer); pressTimer = setTimeout(() => setDest(ev.latLng.toJSON()), 600); });
  ['mouseup', 'dragstart', 'mousemove', 'zoom_changed', 'bounds_changed'].forEach(evn => map.addListener(evn, () => clearTimeout(pressTimer)));

  setFollow(true);
  startWatch();
  setInterval(() => { if (!document.hidden) refreshPos(); }, LOCATE_MS);
  // 手機把 App 丟到背景再叫回來，持續定位常會被系統停掉 → 回到前景就重開
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { startWatch(); refreshPos(); } });
  loadData();
  setInterval(loadData, REFRESH_MS);
  initPlaces();
}

/* ========= 定位（持續追蹤） ========= */
function setFollow(on) { following = on; $('btnLoc').classList.toggle('on', on); }
function onPos(p) {
  me = { lat: p.coords.latitude, lng: p.coords.longitude };
  const first = !meMarker;
  if (first) {
    const el = document.createElement('div');
    el.style.cssText = 'width:16px;height:16px;border-radius:50%;background:#3b82f6;border:3px solid #fff;box-shadow:0 0 0 6px rgba(59,130,246,.3)';
    meMarker = new google.maps.marker.AdvancedMarkerElement({ map, position: me, content: el, zIndex: 999 });
  } else meMarker.position = me;
  if (following) { map.panTo(me); if (first) map.setZoom(16); }
  if (/^(等定位|拿不到定位)/.test($('status').textContent)) setStatus(statusBase);
  // 規劃中：位置變了就默默更新距離與導航連結，不重新縮放地圖、不把卡片彈回來
  if (planning && dest) makePlan(!planWaiting);
}
function onPosErr(e) {
  if (e.code === 1) setStatus('拿不到定位，請允許位置權限');
  else if (!me) setStatus('等定位中…（訊號弱）');
}
function startWatch() {   // 走動時藍點即時跟著動
  if (!navigator.geolocation) { setStatus('這個瀏覽器不支援定位'); return; }
  if (watchId !== null) navigator.geolocation.clearWatch(watchId);
  watchId = navigator.geolocation.watchPosition(onPos, onPosErr, { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 });
}
function refreshPos() {   // 強制重抓一次：每 30 秒、按 ◎、App 回到前景
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(onPos, onPosErr, { enableHighAccuracy: true, maximumAge: 0, timeout: 15000 });
}

function pinClass(s) {
  if (mode === 'rent') { const e = eOf(s), y = yOf(s); return e > 0 ? 'g' : (y > 0 ? 'y' : 'r'); }
  return s.empty_spaces > 2 ? 'g' : (s.empty_spaces > 0 ? 'y' : 'r');
}
function pinText(s) { return mode === 'rent' ? (onlyE ? eOf(s) : eOf(s) + yOf(s)) : s.empty_spaces; }
function visible(s) {
  if (mode === 'rent' && onlyE) return eOf(s) > 0;
  return true;
}

function render() {
  if (!map || !stations.length) return;
  const b = map.getBounds(); if (!b) return;
  const z = map.getZoom();
  const keep = new Set();
  if (z < MIN_ZOOM_FOR_PINS) {
    setStatus('放大地圖才會顯示站點');
  } else {
    // 先挑畫面內、要顯示的站；太多就只留離畫面中心最近的 MAX_PINS 個
    const c = map.getCenter().toJSON();
    let list = stations.filter(s => b.contains(s) && (visible(s) || selected?.station_no === s.station_no));
    if (list.length > MAX_PINS) {
      list.sort((p, q) => dist(c, p) - dist(c, q));
      list = list.slice(0, MAX_PINS);
      if (selected && !list.some(s => s.station_no === selected.station_no)) list.push(selected);
      setStatus(`畫面內站點太多，只顯示最近的 ${MAX_PINS} 站；放大看更多`);
    } else if ($('status').textContent.startsWith('畫面內') || $('status').textContent.startsWith('放大')) {
      setStatus(statusBase);
    }
    for (const s of list) {
      keep.add(s.station_no);
      let m = markers.get(s.station_no);
      const cls = 'pin ' + pinClass(s) + (selected?.station_no === s.station_no ? ' sel' : '');
      const txt = String(pinText(s));
      if (!m) {
        const el = document.createElement('div');
        el.className = cls; el.textContent = txt;
        m = new google.maps.marker.AdvancedMarkerElement({ map, position: s, content: el, title: s.name_tw });
        m.addListener('click', () => showStation(s));
        markers.set(s.station_no, m);
      } else {
        m.content.className = cls; m.content.textContent = txt; m.station = s;
      }
    }
  }
  for (const [no, m] of markers) if (!keep.has(no)) { m.map = null; markers.delete(no); }
  renderPlaces();
}

/* ========= 站點卡片 ========= */
function showStation(s) {
  selected = s;
  showPanel('stationView'); selectedPlace = null; renderPlaces();
  $('cName').textContent = s.name_tw.replace(/^YouBike2\.0_/, '');
  const d = me ? `｜距你 ${fmtD(dist(me, s))}` : '';
  $('cAddr').textContent = (s.district_tw || '') + ' ' + (s.address_tw || '') + d;
  $('cE').textContent = eOf(s); $('cY').textContent = yOf(s); $('cEmpty').textContent = s.empty_spaces;
  $('cNav').href = `https://www.google.com/maps/dir/?api=1&destination=${s.lat},${s.lng}&travelmode=walking`;
  $('card').classList.add('show');
  render();
}
function hideCard() { $('card').classList.remove('show'); selected = null; selectedPlace = null; render(); renderPlaces(); }
function showPanel(id) { ['stationView', 'placeView', 'plan'].forEach(x => { if (x === 'plan') $('plan').classList.toggle('show', id === 'plan'); else $(x).style.display = (x === id) ? '' : 'none'; }); }

/* ========= 路線規劃 ========= */
function setDest(ll) {
  dest = ll; planning = true; $('hint').classList.remove('show');
  if (!destMarker) {
    const el = document.createElement('div'); el.className = 'dpin';
    destMarker = new google.maps.marker.AdvancedMarkerElement({ map, position: ll, content: el, zIndex: 998, gmpDraggable: true });
    destMarker.addListener('dragend', () => { dest = destMarker.position; makePlan(); });
  } else destMarker.position = ll;
  makePlan();
}
function nearest(from, pred) {
  let best = null, bd = Infinity;
  for (const s of stations) { if (!pred(s)) continue; const d = dist(from, s); if (d < bd) { bd = d; best = s; } }
  return best ? { s: best, d: bd } : null;
}
function makePlan(quiet = false) {   // quiet＝只更新數字與連結（定位更新時用），不動地圖、不彈卡片
  if (!dest) return;
  if (!me) { planWaiting = true; setStatus('等定位中…'); refreshPos(); return; }
  planWaiting = false;
  const A = startStation ? { s: startStation, d: dist(me, startStation) }
    : (nearest(me, s => eOf(s) > 0) || nearest(me, s => eOf(s) + yOf(s) > 0));
  const B = nearest(dest, s => s.empty_spaces > 0 && s.station_no !== A?.s.station_no);
  if (!A || !B) { if (!quiet) setStatus('附近找不到合適的站'); return; }
  if (!quiet) { showPanel('plan'); $('card').classList.add('show'); }
  $('pA').textContent = `借：${A.s.name_tw.replace(/^YouBike2\.0_/, '')}（⚡${eOf(A.s)}）`; $('pAd').textContent = `走 ${fmtD(A.d)}`;
  $('pB').textContent = `還：${B.s.name_tw.replace(/^YouBike2\.0_/, '')}（空 ${B.s.empty_spaces}）`; $('pBd').textContent = `騎 ${fmtD(dist(A.s, B.s))}`;
  $('pDest').textContent = `再走 ${fmtD(B.d)}`;
  $('pNav').href = `https://www.google.com/maps/dir/?api=1&origin=${me.lat},${me.lng}&destination=${dest.lat},${dest.lng}` +
    `&waypoints=${A.s.lat},${A.s.lng}|${B.s.lat},${B.s.lng}&travelmode=bicycling`;
  if (quiet) return;
  // 讓地圖看得到整條路（先關掉跟隨，不然下一次定位更新又把地圖拉回你身上）
  setFollow(false);
  const bb = new google.maps.LatLngBounds(); [me, A.s, B.s, dest].forEach(p => bb.extend(p));
  map.fitBounds(bb, 60);
}
function clearPlan() {
  planning = false; dest = null; startStation = null;
  if (destMarker) { destMarker.map = null; destMarker = null; }
  hideCard();
}

/* ========= 我的地點（Google 地圖收藏，加密檔 places.enc） ========= */
const PLACES_URL = 'places.enc';
const MAX_PLACE_PINS = 150;
let places = [], placeMarkers = new Map(), showPlaces = false, selectedPlace = null, placesEnc = null;

const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const shortTitle = t => (t || '').split(/\s*[|｜]\s*/)[0].trim();   // 「店名｜SEO 一長串」只留店名
async function deriveKey(password, salt, iter) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
}
async function decryptPlaces(key) {
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64d(placesEnc.iv) }, key, b64d(placesEnc.data));
  return JSON.parse(new TextDecoder().decode(pt));
}
function usePlaces(data) {
  places = [];
  for (const L of data.lists) for (const it of L.items) places.push({ ...it, list: L.name, lat: +it.lat, lng: +it.lng });
  showPlaces = true; $('togglePlaces').classList.add('on'); $('togglePlaces').textContent = `❤ ${places.length}`;
  renderPlaces();
}
async function initPlaces() {
  try {
    const r = await fetch(PLACES_URL, { cache: 'no-store' }); if (!r.ok) return;
    placesEnc = await r.json();
  } catch { return; }
  $('segPlaces').style.display = '';
  // 手機上存過金鑰就直接解
  const saved = localStorage.getItem('placesKey');
  if (saved) {
    try {
      const key = await crypto.subtle.importKey('raw', b64d(saved), 'AES-GCM', true, ['decrypt']);
      usePlaces(await decryptPlaces(key)); return;
    } catch { localStorage.removeItem('placesKey'); }
  }
  $('pwd').style.display = 'flex';
}
async function unlock() {
  const pw = $('pwdIn').value; if (!pw) return;
  $('pwdErr').textContent = '解鎖中…';
  try {
    const key = await deriveKey(pw, b64d(placesEnc.salt), placesEnc.iter);
    const data = await decryptPlaces(key);
    const raw = await crypto.subtle.exportKey('raw', key);
    localStorage.setItem('placesKey', btoa(String.fromCharCode(...new Uint8Array(raw))));
    $('pwd').style.display = 'none'; usePlaces(data);
  } catch { $('pwdErr').textContent = '密碼不對，再試一次'; }
}
function renderPlaces() {
  if (!map) return;
  const keep = new Set();
  const b = map.getBounds();
  if (showPlaces && b && map.getZoom() >= 11) {
    const c = map.getCenter().toJSON();
    let list = places.filter(p => b.contains(p));
    if (list.length > MAX_PLACE_PINS) { list.sort((p, q) => dist(c, p) - dist(c, q)); list = list.slice(0, MAX_PLACE_PINS); }
    list.forEach((p, i) => {
      const id = p.url + '|' + p.title; keep.add(id);
      const cls = 'pl' + (selectedPlace === p ? ' sel' : '');
      let m = placeMarkers.get(id);
      if (!m) {
        const el = document.createElement('div'); el.className = cls; el.textContent = '❤';
        m = new google.maps.marker.AdvancedMarkerElement({ map, position: p, content: el, title: p.title, zIndex: 5 });
        m.addListener('click', () => showPlace(p));
        placeMarkers.set(id, m);
      } else m.content.className = cls;
    });
  }
  for (const [id, m] of placeMarkers) if (!keep.has(id)) { m.map = null; placeMarkers.delete(id); }
}
function showPlace(p) {
  selectedPlace = p; selected = null;
  showPanel('placeView');
  $('plList').textContent = p.list;
  $('plList').style.background = p.search ? '#ff9f0a' : '';   // 搜尋結果＝橘、收藏＝粉紅
  $('plName').textContent = shortTitle(p.title) || '(未命名)';
  $('plName').title = p.title;
  const d = me ? `｜距你 ${fmtD(dist(me, p))}` : '';
  $('plAddr').textContent = (p.addr || '') + d;
  $('plNote').textContent = p.note || '';
  $('plOpen').href = p.url;
  $('card').classList.add('show');
  render(); renderPlaces();
}
$('togglePlaces').onclick = () => {
  if (!places.length) { $('pwd').style.display = 'flex'; return; }
  showPlaces = !showPlaces; $('togglePlaces').classList.toggle('on', showPlaces); renderPlaces();
};
$('pwdOk').onclick = unlock;
$('pwdIn').addEventListener('keydown', e => { if (e.key === 'Enter') unlock(); });
$('pwdSkip').onclick = () => { $('pwd').style.display = 'none'; };
$('plGo').onclick = () => {
  if (!selectedPlace) return;
  const p = selectedPlace;
  if (p.search) clearSearchMarker();   // 目的地藍點會接手，橘色搜尋點收掉
  setDest({ lat: p.lat, lng: p.lng });
};

/* ========= 搜尋（我的收藏＋Google 地點） ========= */
let sessionToken = null, searchSeq = 0, searchTimer = null, composing = false, suggItems = [];
let searchMarker = null, searchPlace = null;

function queueSearch(ms = 300) { clearTimeout(searchTimer); searchTimer = setTimeout(runSearch, ms); }
function hideSugg() { clearTimeout(searchTimer); searchSeq++; $('sugg').classList.remove('show'); }
function flyTo(p) { setFollow(false); map.panTo(p); if (map.getZoom() < 16) map.setZoom(16); }

async function runSearch() {
  const q = $('q').value.trim();
  $('qClear').style.display = q ? 'block' : 'none';
  if (!q) { suggItems = []; hideSugg(); return; }
  const seq = ++searchSeq;
  const near = me || map.getCenter().toJSON();
  const items = [];
  // 1) 我的收藏：在手機上直接比對，不花 Google 額度
  const ql = q.toLowerCase();
  places.filter(p => `${p.title} ${p.addr || ''} ${p.note || ''}`.toLowerCase().includes(ql))
    .sort((a, b) => dist(near, a) - dist(near, b)).slice(0, 5)
    .forEach(p => items.push({ kind: 'fav', main: shortTitle(p.title) || '(未命名)', sub: p.list + (p.addr ? '｜' + p.addr : ''), d: me ? dist(me, p) : null, p }));
  if (q.length < 2) { renderSugg(items, items.length ? '' : '再多打一個字'); return; }
  renderSugg(items, 'Google 搜尋中…');
  // 2) Google 地點（Places API (New) Autocomplete，只搜台灣、離你近的優先）
  try {
    const { AutocompleteSuggestion, AutocompleteSessionToken } = await google.maps.importLibrary('places');
    sessionToken ??= new AutocompleteSessionToken();
    const req = { input: q, sessionToken, language: 'zh-TW', region: 'tw', includedRegionCodes: ['tw'], locationBias: { center: near, radius: 30000 } };
    if (me) req.origin = me;
    const { suggestions } = await AutocompleteSuggestion.fetchAutocompleteSuggestions(req);
    if (seq !== searchSeq) return;   // 又打了新字，舊結果丟掉
    for (const s of suggestions.slice(0, 6)) {
      const pp = s.placePrediction; if (!pp) continue;
      items.push({ kind: 'g', main: pp.mainText?.text || pp.text.text, sub: pp.secondaryText?.text || '', d: pp.distanceMeters ?? null, pp });
    }
    renderSugg(items, items.length ? '' : '找不到，換個關鍵字試試');
  } catch (e) {
    if (seq !== searchSeq) return;
    console.error(e);
    renderSugg(items, 'Google 搜尋還不能用（金鑰要加開 Places API (New)）');
  }
}

function renderSugg(items, msg) {
  suggItems = items;
  const box = $('sugg'); box.textContent = '';
  for (const it of items) {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'sg ' + it.kind;
    const ic = document.createElement('span'); ic.className = 'ic'; ic.textContent = it.kind === 'fav' ? '❤' : '📍';
    const tx = document.createElement('span'); tx.className = 'tx';
    const m = document.createElement('b'); m.textContent = it.main;
    const s = document.createElement('span'); s.textContent = it.sub;
    tx.append(m, s); b.append(ic, tx);
    if (it.d != null) { const d = document.createElement('small'); d.textContent = fmtD(it.d); b.append(d); }
    b.onclick = () => pickSugg(it);
    box.append(b);
  }
  if (msg) { const d = document.createElement('div'); d.className = 'sgMsg'; d.textContent = msg; box.append(d); }
  box.classList.toggle('show', items.length > 0 || !!msg);
}

async function pickSugg(it) {
  hideSugg(); $('q').blur(); $('q').value = it.main; $('qClear').style.display = 'block';
  if (it.kind === 'fav') {
    clearSearchMarker();
    if (!showPlaces) { showPlaces = true; $('togglePlaces').classList.add('on'); }
    flyTo(it.p); showPlace(it.p); return;
  }
  try {
    setStatus('讀取地點中…');
    const place = it.pp.toPlace();
    await place.fetchFields({ fields: ['location', 'formattedAddress'] });   // 只拿基本欄位（Essentials，每月 10,000 次免費）
    sessionToken = null;   // 這一輪搜尋結束，下次換新的
    const ll = place.location.toJSON();
    const p = { title: it.main, addr: place.formattedAddress || it.sub, note: '', list: '搜尋結果', lat: ll.lat, lng: ll.lng, search: true,
      url: `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(it.main)}&query_place_id=${encodeURIComponent(place.id)}` };
    setStatus(statusBase);
    showSearchMarker(p); flyTo(p); showPlace(p);
  } catch (e) {
    console.error(e);
    setStatus('這個地點讀不到，換一個試試');
  }
}
function showSearchMarker(p) {
  searchPlace = p;
  if (!searchMarker) {
    const el = document.createElement('div'); el.className = 'srch'; el.textContent = '📍';
    searchMarker = new google.maps.marker.AdvancedMarkerElement({ map, position: p, content: el, zIndex: 997 });
    searchMarker.addListener('click', () => { if (searchPlace) showPlace(searchPlace); });
  } else { searchMarker.position = p; searchMarker.map = map; }
}
function clearSearchMarker() { if (searchMarker) searchMarker.map = null; searchPlace = null; }

$('q').addEventListener('compositionstart', () => { composing = true; });            // 注音選字中先不搜
$('q').addEventListener('compositionend', () => { composing = false; queueSearch(); });
$('q').addEventListener('input', () => { if (!composing) queueSearch(); });
$('q').addEventListener('focus', () => { $('q').select(); if ($('q').value.trim()) queueSearch(0); });
$('q').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.isComposing && suggItems.length) { e.preventDefault(); pickSugg(suggItems[0]); }
  if (e.key === 'Escape') { hideSugg(); $('q').blur(); }
});
$('qClear').onclick = () => {
  $('q').value = ''; $('qClear').style.display = 'none'; suggItems = []; hideSugg();
  if (selectedPlace?.search) hideCard();
  clearSearchMarker();
  $('q').focus();
};

/* ========= 事件 ========= */
$('modeRent').onclick = () => { mode = 'rent'; $('modeRent').classList.add('on'); $('modeReturn').classList.remove('on'); $('filterE').style.display = ''; render(); };
$('modeReturn').onclick = () => { mode = 'return'; $('modeReturn').classList.add('on'); $('modeRent').classList.remove('on'); $('filterE').style.display = 'none'; render(); };
$('filterE').onclick = () => { onlyE = !onlyE; $('filterE').classList.toggle('on', onlyE); render(); };
$('btnLoc').onclick = () => { setFollow(true); if (me) map.panTo(me); if (watchId === null) startWatch(); refreshPos(); };
$('btnDest').onclick = () => { if (planning) { showPanel('plan'); $('card').classList.add('show'); } else $('hint').classList.toggle('show'); };
$('close').onclick = () => { if (planning && $('plan').classList.contains('show')) $('card').classList.remove('show'); else hideCard(); };
$('cSetStart').onclick = () => { startStation = selected; if (dest) makePlan(); else { $('hint').classList.add('show'); $('card').classList.remove('show'); } };
$('pClear').onclick = clearPlan;

/* ========= 載入 Google Maps ========= */
if (API_KEY === 'YOUR_KEY_HERE') $('keywarn').style.display = 'block';
window.initMap = initMap;
const sc = document.createElement('script');
sc.src = `https://maps.googleapis.com/maps/api/js?key=${API_KEY}&libraries=marker,places&v=weekly&language=zh-TW&region=TW&loading=async&callback=initMap`;
sc.async = true; document.head.appendChild(sc);
</script>
</body>
